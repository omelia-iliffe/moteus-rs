[package]
name = "moteus"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/omelia-iliffe/moteus-rs"
description = "Rust library for interfacing with Moteus controllers"

[dependencies]
fdcanusb = { version = "0.7.0", default-features = false}
byteorder = "1.5.0"
zerocopy = { version = "0.8", features = ["derive"] }
num-traits = "0.2"
num-derive = "0.4"
log = "0.4"
itertools = "0.14"
thiserror = "2"

[dev-dependencies]
env_logger = "0.11"

[features]
default = ["fdcanusb"]
fdcanusb = []
log = ["fdcanusb/log"]
aux_index_raw = []
